<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="theme-color" content="#111111">
<title>Recipes</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --card: #fafafa;
    --accent: #2b7a4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #ececec;
      --muted: #9a9a9a;
      --line: #2c2c2c;
      --card: #1d1d1d;
      --accent: #6bd699;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.25rem 1rem 3rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    max-width: 34rem;
    margin-inline: auto;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 1.25rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: flex-start;
    gap: .875rem;
    padding: .875rem 1rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: .625rem;
    margin-bottom: .625rem;
  }
  input[type=checkbox] {
    width: 1.5rem; height: 1.5rem;
    margin: .125rem 0 0;
    flex: 0 0 auto;
    accent-color: var(--accent);
  }
  .meta { min-width: 0; flex: 1; }
  a { color: inherit; text-decoration: none; font-weight: 600; }
  a:active { opacity: .6; }
  .date { display: block; color: var(--muted); font-size: .8125rem; font-weight: 400; margin-top: .125rem; }
  li.done a { text-decoration: line-through; }
  li.done .meta { opacity: .5; }
  .tag {
    font-size: .6875rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--accent); font-weight: 700; margin-top: .25rem; display: none;
  }
  li.done .tag { display: block; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: .8125rem; }
  button {
    font: inherit; font-size: .8125rem; color: var(--muted);
    background: none; border: 1px solid var(--line);
    border-radius: .375rem; padding: .375rem .75rem; cursor: pointer;
  }
</style>
<body>
<h1>Recipes</h1>
<p class="sub" id="progress">&nbsp;</p>
<ul id="list"></ul>
<footer>
  <p>Check a recipe once you've imported it into AnyList. Checks are saved on this device only.</p>
  <button id="reset" type="button">Clear all checks</button>
</footer>
<script>
  // Newest first. `added` is the date the recipe was added to the repo.
  var RECIPES = [
    { file: "vanilla-protein-deluxe.html",        name: "Vanilla Protein (Deluxe)",         added: "2026-08-31" },
    { file: "cookies-and-cream.html",              name: "Cookies & Cream",                  added: "2026-08-31" },
    { file: "fairlife-protein-ice-cream.html",       name: "Fairlife Protein Ice Cream",       added: "2026-08-31" },
    { file: "greek-yogurt-protein-ice-cream.html",   name: "Greek Yogurt Protein Ice Cream",   added: "2026-08-31" },
    { file: "basic-protein-ice-cream.html",          name: "Basic Protein Ice Cream",          added: "2026-08-31" },
    { file: "cottage-cheese-protein-ice-cream.html", name: "Cottage Cheese Protein Ice Cream", added: "2026-08-31" }
  ];

  var KEY = "recipes.imported.v1";

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { return {}; }
  }
  function save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = load();
  var list = document.getElementById("list");
  var progress = document.getElementById("progress");

  // Sort newest first; ties keep the order above.
  RECIPES.slice().sort(function (a, b) {
    return a.added < b.added ? 1 : a.added > b.added ? -1 : 0;
  }).forEach(function (r) {
    var li = document.createElement("li");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!state[r.file];
    box.setAttribute("aria-label", "Imported into AnyList: " + r.name);

    var meta = document.createElement("div");
    meta.className = "meta";
    var a = document.createElement("a");
    a.href = r.file;
    a.textContent = r.name;
    var d = document.createElement("span");
    d.className = "date";
    d.textContent = new Date(r.added + "T12:00:00").toLocaleDateString(undefined, {
      year: "numeric", month: "short", day: "numeric"
    });
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "In AnyList";
    meta.append(a, d, tag);
    li.append(box, meta);

    function sync() {
      li.classList.toggle("done", box.checked);
      state[r.file] = box.checked;
      save(state);
      render();
    }
    box.addEventListener("change", sync);
    li.classList.toggle("done", box.checked);
    list.append(li);
  });

  function render() {
    var done = RECIPES.filter(function (r) { return state[r.file]; }).length;
    progress.textContent = done + " of " + RECIPES.length + " imported into AnyList";
  }
  render();

  document.getElementById("reset").addEventListener("click", function () {
    state = {};
    save(state);
    location.reload();
  });
</script>
</body>
